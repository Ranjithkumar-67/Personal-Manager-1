workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.personalmanagepro
      vars:
        XCODE_WORKSPACE: "ios/PersonalManagePro.xcworkspace"
        XCODE_SCHEME: "PersonalManagePro"
      node: 20.11.0
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS app
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/build/**/*.app
      - ios/build/**/*.ipa
    publishing:
      email:
        recipients:
          - ranjithrajendran2510@gmail.com

  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - personalmanagepro_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.personalmanagepro"
      node: 20.11.0
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - ranjithrajendran2510@gmail.com
